name: Pico-Rover CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Default to read-only.
# The deploy job grants only the permissions it needs.
permissions:
  contents: read

concurrency:
  group: pico-rover-pages
  cancel-in-progress: true


# ============================================================
# CI — VALIDATE THE PROJECT
# ============================================================

jobs:

  ci:
    name: 🧪 Validate Pico-Rover
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: 📥 Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python / Pico W firmware validation
      # --------------------------------------------------------

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: 🔍 Validate firmware Python syntax
        run: |
          python -m compileall -q firmware


      # --------------------------------------------------------
      # Verify required project structure
      # --------------------------------------------------------

      - name: 📁 Validate project structure
        shell: bash
        run: |
          set -e

          test -f README.md

          test -d frontend
          test -f frontend/index.html

          test -d firmware
          test -f firmware/main.py
          test -f firmware/config.py
          test -f firmware/motor_control.py
          test -f firmware/wifi_manager.py
          test -f firmware/api_server.py

          test -d docs

          echo "Project structure OK."


      # --------------------------------------------------------
      # HTML validation
      # --------------------------------------------------------

      - name: 🌐 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: 📦 Install frontend validation tools
        run: |
          npm install --no-save \
            htmlhint \
            eslint \
            stylelint


      - name: ✅ Validate HTML
        run: |
          npx htmlhint "frontend/**/*.html"


      # --------------------------------------------------------
      # Basic JavaScript validation
      # --------------------------------------------------------

      - name: ⚙️ Validate JavaScript
        run: |
          npx eslint "frontend/**/*.js" \
            --no-config-lookup \
            --rule 'no-unused-vars: warn' \
            --rule 'no-undef: warn'


      # --------------------------------------------------------
      # Basic CSS validation
      # --------------------------------------------------------

      - name: 🎨 Validate CSS
        run: |
          npx stylelint "frontend/**/*.css" \
            --config-basedir frontend \
            --allow-empty-input


      # --------------------------------------------------------
      # Check for accidental secrets
      # --------------------------------------------------------

      - name: 🔐 Check for obvious credential leaks
        shell: bash
        run: |
          set -e

          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' \
            .; then

            echo "ERROR: Possible GitHub token detected."
            exit 1
          fi

          echo "No obvious GitHub token detected."


  # ============================================================
  # BUILD — PREPARE ONLY THE WEB APPLICATION
  # ============================================================

  build:
    name: 📦 Build Web Application
    runs-on: ubuntu-latest

    needs:
      - ci

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4


      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5


      # --------------------------------------------------------
      # Build Pages site
      #
      # IMPORTANT:
      # Only frontend/ is deployed.
      #
      # firmware/ and docs/ remain in GitHub but are NOT
      # published as the live control application.
      # --------------------------------------------------------

      - name: 🏗️ Build frontend
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          cp -R frontend/. _site/

          # Prevent GitHub Pages/Jekyll from changing files.
          touch _site/.nojekyll

          echo "Pages site:"
          find _site -maxdepth 3 -type f | sort


      # --------------------------------------------------------
      # Upload Pages artifact
      # --------------------------------------------------------

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site


  # ============================================================
  # DEPLOY — GITHUB PAGES
  # ============================================================

  deploy:
    name: 🚀 Deploy GitHub Pages
    runs-on: ubuntu-latest

    needs:
      - build

    # GitHub Pages requires these permissions.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🌐 Display deployed URL
        run: |
          echo "======================================"
          echo " Pico-Rover deployment successful"
          echo "======================================"
          echo ""
          echo "Live URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
