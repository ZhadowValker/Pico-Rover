name: 🤖 Pico-Rover

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pico-rover-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # 🧪 CI — VALIDATE PROJECT
  # ==========================================================

  validate:
    name: 🧪 Validate Firmware
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout source
        uses: actions/checkout@v4


      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: 🔍 Check Python syntax
        run: |
          echo "🔍 Checking Pico W firmware..."

          python -m compileall -q firmware

          echo "✅ Firmware syntax is valid"


      - name: 📁 Check firmware files
        shell: bash
        run: |
          set -e

          echo "📁 Checking firmware structure..."

          files=(
            "firmware/main.py"
            "firmware/config.py"
            "firmware/motor_control.py"
            "firmware/wifi_manager.py"
            "firmware/api_server.py"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi

            echo "✅ $file"
          done

          echo ""
          echo "🎉 All firmware files found!"


      - name: 🌐 Check frontend files
        shell: bash
        run: |
          set -e

          echo "🌐 Checking frontend structure..."

          test -f frontend/index.html

          echo "✅ frontend/index.html"

          if [ -d frontend/css ]; then
            echo "✅ frontend/css/"
          fi

          if [ -d frontend/js ]; then
            echo "✅ frontend/js/"
          fi

          if [ -d frontend/libs ]; then
            echo "✅ frontend/libs/"
          fi

          echo ""
          echo "🎉 Frontend structure OK!"


      - name: 🔐 Check for exposed tokens
        shell: bash
        run: |
          echo "🔐 Checking for accidental GitHub tokens..."

          if grep -RniE \
            -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' \
            firmware frontend \
            --exclude='*.md' \
            --exclude-dir=node_modules; then

            echo ""
            echo "❌ Possible GitHub token detected!"
            exit 1
          fi

          echo "✅ No GitHub tokens detected"


      - name: 📊 CI Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🤖 Pico-Rover CI"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| 🐍 Python syntax | ✅ Passed |"
            echo "| 📁 Firmware structure | ✅ Passed |"
            echo "| 🌐 Frontend structure | ✅ Passed |"
            echo "| 🔐 Credential scan | ✅ Passed |"
            echo ""
            echo "### 🚗 Project"
            echo ""
            echo "Pico-Rover source validation completed."
          } >> "$GITHUB_STEP_SUMMARY"


  # ==========================================================
  # 📦 BUILD — FIRMWARE
  # ==========================================================

  build:
    name: 📦 Build Firmware
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:

      - name: 📥 Checkout source
        uses: actions/checkout@v4


      - name: 📦 Prepare firmware package
        shell: bash
        run: |
          set -e

          echo "📦 Preparing Pico-Rover firmware..."

          rm -rf dist
          mkdir -p dist/firmware

          cp firmware/*.py dist/firmware/

          if [ -f README.md ]; then
            cp README.md dist/
          fi

          echo ""
          echo "📦 Firmware package:"
          find dist -type f | sort

          echo ""
          echo "✅ Firmware package created"


      - name: 📤 Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-rover-firmware
          path: dist/
          retention-days: 30


      - name: 📊 Build Summary
        run: |
          {
            echo "## 📦 Pico-Rover Firmware"
            echo ""
            echo "### Build successful ✅"
            echo ""
            echo "Firmware has been packaged successfully."
            echo ""
            echo "📥 **Artifact:** \`pico-rover-firmware\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ==========================================================
  # 🌐 BUILD & DEPLOY GITHUB PAGES
  # ==========================================================

  pages:
    name: 🌐 Deploy Web UI
    runs-on: ubuntu-latest

    needs:
      - validate

    # Only deploy the live site for pushes/manual runs.
    # Pull requests still validate the frontend but do not
    # publish changes to production GitHub Pages.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: 📥 Checkout source
        uses: actions/checkout@v4


      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: 🔍 Verify frontend
        shell: bash
        run: |
          set -e

          echo "🔍 Checking web application..."

          test -f frontend/index.html

          echo "✅ frontend/index.html found"

          echo ""
          echo "📁 Frontend contents:"
          find frontend -maxdepth 3 -type f | sort


      - name: 🏗️ Build Web UI
        shell: bash
        run: |
          set -e

          echo "🏗️ Building Pico-Rover Web UI..."

          rm -rf _site
          mkdir -p _site

          cp -R frontend/. _site/

          # Disable Jekyll processing.
          touch _site/.nojekyll

          echo ""
          echo "🌐 Site contents:"
          find _site -type f | sort

          echo ""
          echo "✅ Web UI build complete"


      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site


      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: 📊 Deployment Summary
        run: |
          {
            echo "## 🌐 Pico-Rover Web UI"
            echo ""
            echo "### 🚀 Deployment successful"
            echo ""
            echo "🔗 **Live site:** ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
