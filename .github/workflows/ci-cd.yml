name: 🤖 Pico-Rover

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pico-rover-${{ github.ref }}
  cancel-in-progress: true


# ============================================================
# 🧪 CI — CHECK THE PROJECT
# ============================================================

jobs:

  validate:
    name: 🧪 Validate Firmware
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout source
        uses: actions/checkout@v4


      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: 🔍 Check Python syntax
        run: |
          echo "🔍 Checking Pico W firmware..."

          python -m compileall -q firmware

          echo "✅ Firmware syntax is valid"


      - name: 📁 Check firmware files
        run: |
          echo "📁 Checking project structure..."

          files=(
            "firmware/main.py"
            "firmware/config.py"
            "firmware/motor_control.py"
            "firmware/wifi_manager.py"
            "firmware/api_server.py"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi

            echo "✅ $file"
          done

          echo ""
          echo "🎉 All firmware files found!"


      - name: 🔐 Check for exposed tokens
        run: |
          echo "🔐 Checking for accidental GitHub tokens..."

          if grep -RniE \
            -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' \
            firmware \
            --exclude='*.md'; then

            echo ""
            echo "❌ Possible GitHub token detected!"
            exit 1
          fi

          echo "✅ No GitHub tokens detected"


      # --------------------------------------------------------
      # GitHub Actions summary
      # --------------------------------------------------------

      - name: 📊 CI Summary
        if: always()
        run: |
          echo "## 🤖 Pico-Rover CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐍 Python syntax | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📁 Firmware structure | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔐 Secret scan | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📦 Firmware" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The firmware is ready for the Pico W." >> "$GITHUB_STEP_SUMMARY"


# ============================================================
# 📦 BUILD — PACKAGE FIRMWARE
# ============================================================

  build:
    name: 📦 Build Firmware
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:

      - name: 📥 Checkout source
        uses: actions/checkout@v4


      - name: 📦 Prepare firmware package
        run: |
          echo "📦 Preparing Pico-Rover firmware..."

          mkdir -p dist/firmware

          cp firmware/*.py dist/firmware/

          echo "✅ Firmware package created"

          echo ""
          echo "Files:"
          find dist -type f | sort


      - name: 📤 Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico-rover-firmware
          path: dist/
          retention-days: 30


      - name: 📊 Build Summary
        run: |
          echo "## 📦 Pico-Rover Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Firmware Package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Firmware successfully packaged." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📥 Download the **pico-rover-firmware** artifact from this workflow run." >> "$GITHUB_STEP_SUMMARY"


# ============================================================
# 🌐 GITHUB PAGES
#
# Runs only when frontend/ exists.
# ============================================================

pages:
  name: 🌐 Deploy Web UI
  runs-on: ubuntu-latest

  needs:
    - validate

  permissions:
    contents: read
    pages: write
    id-token: write

  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}

  steps:
    - name: 📥 Checkout source
      uses: actions/checkout@v4

    - name: ⚙️ Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: 🏗️ Build Web UI
      run: |
        set -e
        test -f frontend/index.html

        rm -rf _site
        mkdir -p _site
        cp -R frontend/. _site/
        touch _site/.nojekyll

    - name: 📤 Upload Pages package
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: 📊 Deployment Summary
      run: |
        echo "## 🌐 Pico-Rover Web UI" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### 🚀 Deployment successful" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "🔗 **Live site:** ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
